services:
  - type: web
    name: neuedge-erp-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neuedge-erp-db
          property: connectionString
      - key: Database__InitializationMode
        value: Migrate
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: Jwt__Issuer
        value: neuedge
      - key: Jwt__Audience
        value: neuedge
      - key: Jwt__Key
        generateValue: true
      - key: Security__EnforceHttps
        value: "false"
      - key: NEUEDGE_SECURE_COOKIES
        value: "true"
      - key: NEUEDGE_BACKEND_PROXY_TIMEOUT_MS
        value: "60000"
      - key: NEXT_PUBLIC_NEUEDGE_ALLOW_SELF_REGISTRATION
        value: "false"
      - key: SEED_SERVICE_DEMO_DATA
        value: "true"
      - key: Auth__BootstrapAdminEmail
        sync: false
      - key: Auth__BootstrapAdminPassword
        sync: false
      - key: Auth__BootstrapAdminDisplayName
        value: Demo Admin

databases:
  - name: neuedge-erp-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: neuedge
    user: neuedge
    ipAllowList: []
